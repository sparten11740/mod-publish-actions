name: Sync Modrinth gallery
description: Sync a folder of images to the gallery of a Modrinth project
inputs:
  token:
    description: Modrinth personal access token with the PROJECT_READ and PROJECT_WRITE scopes
    required: true
  project-id:
    description: Modrinth project ID or slug
    required: true
  images:
    description: Folder of images to sync. They are ordered by file name, the first is featured, and titles come from file names, so give a replaced image a new file name
    required: false
    default: docs/images
  remove-missing:
    description: Delete gallery images whose titles match no file in the folder, including images added by hand, and all but the first of any images sharing a title. Deleted images cannot be recovered
    required: false
    default: 'false'
runs:
  using: node24
  main: dist/index.cjs
